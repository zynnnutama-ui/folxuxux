# Dibuat oleh Axware Git — build APK otomatis (Android native (Gradle))
# Jalankan manual: tab Actions → "Axware Build APK" → Run workflow, atau push ke branch main.
# Signing release (opsional): secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Axware Build APK

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "docs/**" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Jenis build"
        type: choice
        options: [ auto, debug, release ]
        default: auto
      make_release:
        description: "Buat GitHub Release berisi APK"
        type: boolean
        default: false

concurrency:
  group: axware-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      BUILD_INPUT: ${{ inputs.build_type || 'auto' }}
      APP_NAME: "folxuxux"
      APP_ID: "com.axware.folxuxux"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Tentukan jenis build
        id: mode
        run: |
          if [ "$BUILD_INPUT" = "auto" ]; then
            if [ "$HAS_KEYSTORE" = "true" ]; then echo "type=release" >> "$GITHUB_OUTPUT"; else echo "type=debug" >> "$GITHUB_OUTPUT"; fi
          else echo "type=$BUILD_INPUT" >> "$GITHUB_OUTPUT"; fi
          echo "Jenis build: $(tail -1 "$GITHUB_OUTPUT")"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build dengan Gradle
        shell: bash
        run: |
          cd "AxwareStream"
          chmod +x ./gradlew; GW="./gradlew"
          if [ "${{ steps.mode.outputs.type }}" = "release" ]; then T=assembleRelease; else T=assembleDebug; fi
          $GW ":app:$T" --stacktrace --no-daemon

      - name: Kumpulkan & tanda tangani APK
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p axg-out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          mapfile -t APKS < <(find . -path ./node_modules -prune -o -path ./axg-out -prune -o -name "*.apk" -type f -print | grep -v "/intermediates/" | grep -v "androidTest")
          [ ${#APKS[@]} -gt 0 ] || { echo "::error::Tidak ada file APK yang dihasilkan"; exit 1; }
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"; fi
          for f in "${APKS[@]}"; do
            n=$(basename "$f" .apk | sed "s/-unsigned//")
            if [ -n "$KS_B64" ] && [ "${{ steps.mode.outputs.type }}" = "release" ]; then
              "$BT/zipalign" -f -p 4 "$f" "$RUNNER_TEMP/aligned.apk"
              "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "axg-out/${APP_NAME// /_}-$n.apk" "$RUNNER_TEMP/aligned.apk"
            else cp "$f" "axg-out/${APP_NAME// /_}-$n.apk"; fi
          done
          for f in axg-out/*.apk; do "$BT/apksigner" verify "$f" && echo "OK: $f ($(du -h "$f" | cut -f1))" || echo "::warning::$f belum ditandatangani (unsigned)"; done
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-apk
          path: axg-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Buat GitHub Release
        if: ${{ inputs.make_release == true || startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date +%Y.%m.%d)-${{ github.run_number }}"
          gh release create "$TAG" axg-out/*.apk --title "$APP_NAME $TAG" --notes "Dibangun otomatis oleh Axware Git" --target "$GITHUB_SHA"

      - name: Ringkasan
        if: always()
        shell: bash
        run: |
          echo "### Hasil build $APP_NAME" >> "$GITHUB_STEP_SUMMARY"
          ls -la axg-out 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "Tidak ada APK" >> "$GITHUB_STEP_SUMMARY"
